<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="COGNOS seal">
  <title>COGNOS seal</title>
  <!-- The stamp a decided gate and a sealed package carry: the creed on the rim, the mark at the centre. One colour, so it also works as a mask. -->
  <defs><path id="rim" d="M50 50 m-36 0 a36 36 0 1 1 72 0 a36 36 0 1 1 -72 0"/></defs>
  <circle cx="50" cy="50" r="46" fill="none" stroke="#7d2230" stroke-width="3"/>
  <circle cx="50" cy="50" r="27" fill="none" stroke="#7d2230" stroke-width="1.5"/>
  <text font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="6.2" font-weight="500" fill="#7d2230"><textPath href="#rim" textLength="222" lengthAdjust="spacing">ENGINE DISPOSES · AGENTS RECOMMEND · PEOPLE DECIDE ·</textPath></text>
  <g transform="translate(50 50) scale(0.44) translate(-50 -50)">
  <path d="M71.92 71.92 A31 31 0 0 1 23.15 65.50" fill="none" stroke="#7d2230" stroke-width="13"/>
  <path d="M20.87 60.60 A31 31 0 0 1 51.08 19.02" fill="none" stroke="#7d2230" stroke-width="13" stroke-dasharray="14.43 8.66"/>
  <rect x="60.22" y="16.92" width="16" height="16" fill="#7d2230" transform="rotate(36 68.22 24.92)"/>
  </g>
</svg>
