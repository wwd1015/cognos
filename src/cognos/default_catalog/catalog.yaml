# The default data catalog (ADR-0020), shipped with COGNOS: the tables a commercial-credit team
# typically keeps, what each is for, and how they join, with synthetic data for every table
# (written to <runs>/_catalog/default_data/ on first use) so each built-in template runs out of
# the box. It is used while the runs folder has no catalog of its own. To use your team's
# tables, write <runs>/_catalog/catalog.yaml (`cognos catalog --init` starts it from this one);
# it then replaces this file entirely. Do not edit this file. Each entry is a file, a Snowflake
# table or a read-only query; a relative path is read from <runs>/_catalog/. Never write a
# secret here: connector settings may say env:NAME, and passwords come from the environment.

title: Commercial credit data (default catalog, synthetic)

# What a run started from scratch preselects. A template names its own (data.catalog).
defaults: [obligor_quarters, macro_quarterly]

tables:
  - id: obligor_quarters
    title: Obligor financials by quarter
    description: >-
      The obligor's financial ratios at each quarter end, from the spread statements on file
      at that date, with the 12-month default outcome. The base table for a PD model: one row
      is one obligor observed at one date.
    grain: one row per obligor and quarter end
    keys: [obligor_id, as_of_date]
    datetime_col: as_of_date
    outcomes: [default_12m]
    owner: Credit Risk Analytics
    refresh: quarterly
    source: {kind: file, path: default_data/obligor_quarters.parquet}
    columns:
      obligor_id: Obligor identifier (the bank's customer number).
      as_of_date: Quarter end the ratios are observed at.
      leverage: Total debt over total assets.
      debt_to_ebitda: Total debt over trailing 12-month EBITDA.
      interest_coverage: EBIT over interest expense, trailing 12 months.
      current_ratio: Current assets over current liabilities.
      operating_margin: Operating income over revenue, trailing 12 months.
      log_total_assets: Natural log of total assets (size).
      default_12m: 1 when the obligor defaults (90+ DPD or nonaccrual) within the next four quarters. Outcome data, never a feature.

  - id: facilities
    title: Facility exposures by quarter
    description: >-
      Every credit facility at each quarter end: limit, drawn amount, utilization and
      collateral coverage. Several facilities per obligor, so a join to an obligor table
      averages them per obligor and date.
    grain: one row per facility and quarter end
    keys: [facility_id, as_of_date]
    datetime_col: as_of_date
    owner: Loan Operations
    refresh: quarterly
    source: {kind: file, path: default_data/facilities.parquet}
    columns:
      facility_id: Facility identifier.
      obligor_id: Obligor that owes the facility.
      as_of_date: Quarter end.
      facility_type: revolver or term_loan.
      seniority: senior_secured or senior_unsecured.
      limit: Committed amount.
      drawn: Drawn balance.
      utilization_rate: Drawn over limit.
      collateral_coverage: Collateral value over exposure, at the latest appraisal.

  - id: obligors
    title: Obligor master
    description: >-
      Static attributes of each obligor: industry, region, whether its equity is publicly
      traded and the year it was established.
    grain: one row per obligor
    keys: [obligor_id]
    owner: Customer Data Office
    refresh: daily
    source: {kind: file, path: default_data/obligors.parquet}
    columns:
      obligor_id: Obligor identifier.
      industry: Industry sector (NAICS-based grouping).
      region: US region of the headquarters.
      public: True when the obligor's equity is publicly traded.
      year_established: Year the business was established.

  - id: market_equity
    title: Market data for public obligors
    description: >-
      Equity market value, annualized equity volatility and the face value of debt at each
      quarter end, for publicly traded obligors only. The inputs of a Merton structural
      model (distance to default).
    grain: one row per public obligor and quarter end
    keys: [obligor_id, as_of_date]
    datetime_col: as_of_date
    owner: Market Data
    refresh: daily, kept at quarter ends here
    source: {kind: file, path: default_data/market_equity.parquet}
    columns:
      obligor_id: Obligor identifier.
      as_of_date: Quarter end.
      equity_value: Market capitalization.
      equity_vol: Annualized volatility of equity returns.
      debt_face: Face value of debt (the default point).

  - id: macro_quarterly
    title: Macroeconomic drivers by quarter
    description: >-
      US macro series as published, one row per quarter, with the portfolio's net
      charge-off rate. The base table for a loss forecast; joined on the date to add
      macro conditions to a PD or LGD table.
    grain: one row per quarter end
    keys: [as_of_date]
    datetime_col: as_of_date
    outcomes: [nco_rate]
    owner: Economics and Stress Testing
    refresh: quarterly
    source: {kind: file, path: default_data/macro_quarterly.parquet}
    columns:
      as_of_date: Quarter end.
      unemployment_rate: Civilian unemployment rate, percent.
      gdp_growth: Real GDP growth, annualized percent.
      hpi: House price index (level).
      cre_price_index: Commercial real estate price index (level).
      bbb_spread: BBB corporate bond spread over Treasuries, percent.
      treasury_10y: 10-year Treasury yield, percent.
      vix: Equity volatility index.
      cpi_inflation: CPI inflation, percent.
      nco_rate: Portfolio net charge-offs over average loans, annualized percent. Outcome for a loss forecast.

  - id: rating_history
    title: Agency rating history (external)
    description: >-
      An agency-rated universe observed once a year: the rating at the cohort date and one
      year later, fundamentals, exposure and the macro regime. External data with its own
      obligor identifiers: it does not join to the bank's obligor tables.
    grain: one row per rated obligor and year
    keys: [obligor_id, asof]
    datetime_col: asof
    outcomes: [next_rating, default]
    owner: Credit Risk Analytics (licensed)
    refresh: annual
    source: {kind: file, path: default_data/rating_history.parquet}
    columns:
      obligor_id: Agency obligor identifier.
      asof: Cohort date.
      rating: Rating at the cohort date (AAA ... CCC).
      next_rating: Rating one year later (D for default, NR for withdrawn). Outcome data.
      default: 1 when the obligor defaults within the year. Outcome data.
      ead: Exposure.
      debt_to_ebitda: Total debt over EBITDA at the cohort date.
      interest_coverage: EBIT over interest expense at the cohort date.
      operating_margin: Operating income over revenue at the cohort date.
      log_total_assets: Natural log of total assets.
      sector: Industry sector.
      unemployment_rate: US unemployment rate in the cohort year, percent.
      regime: Macro regime label of the year.

  - id: resolved_defaults
    title: Resolved defaults (workout LGD)
    description: >-
      Every defaulted facility whose workout has closed, with the realized LGD and what was
      known at default. Default dates are quarter ends, so macro conditions join on the date.
    grain: one row per defaulted facility
    keys: [facility_id]
    datetime_col: default_date
    outcomes: [realized_lgd]
    owner: Special Assets
    refresh: monthly
    source: {kind: file, path: default_data/resolved_defaults.parquet}
    columns:
      facility_id: Defaulted facility identifier.
      obligor_id: Obligor identifier.
      default_date: Quarter end of the default.
      facility_type: revolver or term_loan.
      seniority: senior_secured or senior_unsecured.
      industry: Industry sector of the obligor.
      collateral_type: Main collateral at default (none when unsecured).
      collateral_coverage: Collateral value over exposure at default.
      exposure_at_default: Exposure at default.
      realized_lgd: One minus discounted net recoveries over exposure at default. Outcome data.

  - id: revolver_defaults
    title: Defaulted revolvers (CCF)
    description: >-
      Revolving facilities that defaulted, observed 12 months before default, with the
      realized credit conversion factor.
    grain: one row per defaulted revolving facility
    keys: [facility_id]
    datetime_col: observation_date
    outcomes: [realized_ccf]
    owner: Loan Operations
    refresh: monthly
    source: {kind: file, path: default_data/revolver_defaults.parquet}
    columns:
      facility_id: Facility identifier.
      observation_date: Quarter end 12 months before default.
      obligor_id: Obligor identifier.
      limit: Committed amount at observation.
      drawn: Drawn balance at observation.
      facility_age_years: Years since the facility was originated.
      covenant_count: Number of financial covenants on the facility.
      obligor_rating: Internal rating of the obligor at observation (agency-equivalent scale).
      log_total_assets: Natural log of the obligor's total assets at observation.
      utilization_rate: Drawn over limit at observation.
      undrawn: Limit minus drawn at observation.
      realized_ccf: (Drawn at default minus drawn at observation) over undrawn at observation. Outcome data.

# How the tables join, as the data owners document it. Offered at explore and measured on the
# data like any other link; the Data Analyst proposes the join and the developer confirms it.
links:
  - {left: obligor_quarters, left_on: [obligor_id, as_of_date], right: facilities, right_on: [obligor_id, as_of_date], many: aggregate, note: "Facilities averaged per obligor and quarter end."}
  - {left: obligor_quarters, left_on: [obligor_id], right: obligors, right_on: [obligor_id]}
  - {left: obligor_quarters, left_on: [as_of_date], right: macro_quarterly, right_on: [as_of_date], note: "Macro conditions at the observation date."}
  - {left: market_equity, left_on: [obligor_id, as_of_date], right: obligor_quarters, right_on: [obligor_id, as_of_date]}
  - {left: market_equity, left_on: [obligor_id], right: obligors, right_on: [obligor_id]}
  - {left: resolved_defaults, left_on: [default_date], right: macro_quarterly, right_on: [as_of_date], note: "Macro conditions at default (downturn view)."}
  - {left: revolver_defaults, left_on: [observation_date], right: macro_quarterly, right_on: [as_of_date]}
