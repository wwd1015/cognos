# Agent backends. `kind` selects the runner backend (agents/backends/*):
#   heuristic      deterministic agents (offline; tests and demos) — always available
#   replay         recorded outputs from agents.replay_dir (<agent>.json) — always available
#   claude_cli     `claude -p` subprocess (your Claude Code login) — available when `claude` is on PATH
#   anthropic      Anthropic Messages API — available when the key env var is set
#   openai_compat  any OpenAI-compatible Chat Completions API — available when the key env var is set
# A provider's model can be overridden per run (agents.model) or by COGNOS_<ID>_MODEL.
# Prices are USD per 1M tokens and only feed the spend estimate/budget.
heuristic:
  kind: heuristic
  label: Deterministic agents (offline)
replay:
  kind: replay
  label: Replay recorded agent outputs
claude_cli:
  kind: claude_cli
  label: Claude (local Claude Code CLI)
  model: opus
anthropic:
  kind: anthropic
  label: Claude (Anthropic API)
  api_key_env: ANTHROPIC_API_KEY
  model: claude-opus-5-5
  effort: high
  prices: {input: 4.0, output: 20.0}
  model_prices:
    claude-opus-5-5: {input: 4.0, output: 20.0}
    claude-sonnet-5-5: {input: 2.0, output: 10.0}
    claude-haiku-4-5: {input: 1.0, output: 5.0}
openai:
  kind: openai_compat
  label: OpenAI API
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  model: gpt-5-mini
xai:
  kind: openai_compat
  label: Grok (xAI API)
  base_url: https://api.x.ai/v1
  api_key_env: XAI_API_KEY
  model: grok-4.7
  prices: {input: 2.0, output: 6.0}
openrouter:
  kind: openai_compat
  label: OpenRouter (many models)
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  model: anthropic/claude-opus-5-5
ollama:
  kind: openai_compat
  label: Local model (Ollama)
  base_url: http://localhost:11434/v1
  api_key_env: OLLAMA_ENABLED   # set OLLAMA_ENABLED=1 to offer it
  no_key_needed: true
  model: qwen3:32b
