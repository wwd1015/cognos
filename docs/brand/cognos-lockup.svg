  <text x="147" y="101" textLength="446" lengthAdjust="spacing" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-weight="500" font-size="13.5" fill="#5c574b">ENGINE DISPOSES · AGENTS RECOMMEND · <tspan fill="#7d2230">PEOPLE DECIDE</tspan></text>
