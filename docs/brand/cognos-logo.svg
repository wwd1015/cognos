<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" role="img" aria-label="COGNOS">
  <title>COGNOS</title>
  <!-- The two O's are the creed: the dashed one suggests (the agents), the solid one decides (a person). -->
  <g font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-weight="600" font-size="112" fill="#16140f">
    <text x="50" y="100" text-anchor="middle">C</text>
    <text x="232" y="100" text-anchor="middle">G</text>
    <text x="326" y="100" text-anchor="middle">N</text>
    <text x="504" y="100" text-anchor="middle">S</text>
    <circle cx="140" cy="64" r="31" fill="none" stroke="#16140f" stroke-width="11" stroke-dasharray="13.5 9"/>
    <circle cx="418" cy="64" r="37" fill="#7d2230"/>
  </g>
</svg>
